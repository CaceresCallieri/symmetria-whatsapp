<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The renderer loads nothing remote, so the policy can forbid every
         remote origin outright. WhatsApp itself lives in a WebContentsView with
         its own session and is not governed by this. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>Symmetria WhatsApp</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <!-- No title bar. The window is frameless and undecorated, so Hyprland
         moves, resizes and closes it from the keyboard the same way it does
         every other window. A drawn bar would only take a strip of height and
         duplicate what the compositor already does. -->
    <nav id="sidebar" aria-label="Accounts"></nav>

    <!-- Sits behind the account views, so it is only visible in the gap before
         the first account has finished loading. -->
    <div id="placeholder">
      <p id="placeholder-message">Loading accounts…</p>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="shell.js"></script>
  </body>
</html>
